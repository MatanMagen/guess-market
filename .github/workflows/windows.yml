# Temporary: proves the exercise 3 submission works on the platform the grader uses.
# Deleted once it has passed, since it is not part of the exercise.
#
# The Linux job builds everything, runs the engine suite, and runs the HTTP suite against a real
# Tomcat. The Windows job then takes those very jars and does what the grader does: drops the war
# into a Windows Tomcat, drives it over HTTP, and starts the client with run.bat.
#
# A hosted Windows runner has no display, so JavaFX cannot bring up a graphics pipeline there and
# the window itself cannot be checked. What can be checked is everything that makes a submission
# fail before it ever draws: whether run.bat resolves every jar, module and native library.
name: windows check

on:
  push:
    branches: [ex3]
  workflow_dispatch:

env:
  TOMCAT_VERSION: 10.1.26

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and run the engine tests
        run: GM_JAVA_HOME="$JAVA_HOME" ./test.sh
      - name: Run the HTTP tests against Tomcat
        run: |
          curl -sfL -o tomcat.zip "https://archive.apache.org/dist/tomcat/tomcat-10/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.zip"
          unzip -q tomcat.zip
          GM_JAVA_HOME="$JAVA_HOME" GM_TOMCAT="$PWD/apache-tomcat-${TOMCAT_VERSION}" ./servertest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: built
          path: |
            dist/
            build/jars/
            build/client-classes/
            build/test-classes/

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: built

      - name: The engine passes its own tests on Windows
        shell: cmd
        run: java -cp "build\test-classes;build\jars\guess-market-engine.jar;build\jars\guess-market-dto.jar;lib\*" guessmarket.tests.EngineTests test-files

      - name: The war deploys into a Windows Tomcat and answers two clients
        shell: pwsh
        run: |
          Invoke-WebRequest "https://archive.apache.org/dist/tomcat/tomcat-10/v$env:TOMCAT_VERSION/bin/apache-tomcat-$env:TOMCAT_VERSION-windows-x64.zip" -OutFile tomcat.zip
          Expand-Archive tomcat.zip -DestinationPath .
          $tomcat = "$PWD\apache-tomcat-$env:TOMCAT_VERSION"
          Copy-Item dist\guess-market.war "$tomcat\webapps\"
          $env:CATALINA_HOME = $tomcat
          Start-Process -FilePath "$tomcat\bin\catalina.bat" -ArgumentList "start" -NoNewWindow
          $up = $false
          foreach ($i in 1..60) {
            try { Invoke-WebRequest "http://localhost:8080/guess-market/" -UseBasicParsing | Out-Null; $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { Get-Content "$tomcat\logs\*.log"; throw "the war never came up" }
          java -cp "build\test-classes;build\client-classes;build\jars\guess-market-engine.jar;build\jars\guess-market-dto.jar;lib\*;lib\gson\*;lib\http\*" guessmarket.tests.ServerTests http://localhost:8080/guess-market test-files
          if ($LASTEXITCODE -ne 0) { throw "the HTTP tests failed on Windows" }
          Get-ChildItem "$tomcat\temp", "$tomcat\work" -Recurse -File | Where-Object { $_.Name -ne 'safeToDelete.tmp' } | ForEach-Object { Write-Host "left on disk: $($_.FullName)" }

      - name: run.bat resolves every jar, module and native library
        shell: pwsh
        run: |
          Set-Location dist\client
          $out = "$PWD\launch.txt"
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","run.bat" `
                 -RedirectStandardOutput $out -RedirectStandardError "$PWD\launch-err.txt" `
                 -PassThru -NoNewWindow
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $text = (Get-Content $out, "$PWD\launch-err.txt" -ErrorAction SilentlyContinue) -join "`n"
          Write-Host "---- launch output ----"
          Write-Host $text

          $fatal = @(
            'ClassNotFoundException',
            'NoClassDefFoundError',
            'UnsatisfiedLinkError',
            'module not found',
            'Could not find or load main class',
            'FindException',
            'Error opening zip file'
          )
          foreach ($needle in $fatal) {
            if ($text -match [regex]::Escape($needle)) {
              throw "run.bat failed to resolve something: $needle"
            }
          }
          if ($alive) {
            Write-Host "run.bat is still running after 25s - the window came up."
            exit 0
          }
          if ($text -match 'Graphics Device initialization failed') {
            Write-Host "Everything resolved; only the graphics pipeline is missing, which is this runner having no display."
            exit 0
          }
          throw "run.bat exited for a reason that is not the missing display"
