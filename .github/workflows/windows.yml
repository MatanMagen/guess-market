# Temporary: proves the exercise 4 web client starts and works on the platform the grader uses.
# Deleted once it has passed, since it is not part of the exercise.
name: windows check

on:
  push:
    branches: [ex4]
  workflow_dispatch:

env:
  TOMCAT_VERSION: 10.1.26

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and run the engine tests
        run: GM_JAVA_HOME="$JAVA_HOME" ./test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: war
          path: dist/guess-market.war

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: war

      - name: The exercise 3 server comes up in a Windows Tomcat
        shell: pwsh
        run: |
          Invoke-WebRequest "https://archive.apache.org/dist/tomcat/tomcat-10/v$env:TOMCAT_VERSION/bin/apache-tomcat-$env:TOMCAT_VERSION-windows-x64.zip" -OutFile tomcat.zip
          Expand-Archive tomcat.zip -DestinationPath .
          $tomcat = "$PWD\apache-tomcat-$env:TOMCAT_VERSION"
          Copy-Item guess-market.war "$tomcat\webapps\"
          $env:CATALINA_HOME = $tomcat
          Start-Process -FilePath "$tomcat\bin\catalina.bat" -ArgumentList "start" -NoNewWindow
          foreach ($i in 1..60) {
            try { Invoke-WebRequest "http://localhost:8080/guess-market/" -UseBasicParsing | Out-Null; exit 0 }
            catch { Start-Sleep -Seconds 1 }
          }
          throw "the war never came up"

      - name: run.bat serves the page and passes the API through to Tomcat
        shell: pwsh
        run: |
          node --check web\server.js
          node --check web\public\app.js
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c","run.bat" -WorkingDirectory "$PWD\web" `
            -RedirectStandardOutput "$PWD\web-out.txt" -RedirectStandardError "$PWD\web-err.txt" -NoNewWindow
          $up = $false
          foreach ($i in 1..60) {
            try { Invoke-WebRequest "http://localhost:3000/" -UseBasicParsing | Out-Null; $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          Get-Content "$PWD\web-out.txt", "$PWD\web-err.txt" -ErrorAction SilentlyContinue
          if (-not $up) { throw "the page never came up on port 3000" }

          $page = Invoke-WebRequest "http://localhost:3000/" -UseBasicParsing
          if ($page.Content -notmatch 'Guess Market') { throw "the page is not the client" }
          foreach ($asset in 'app.js', 'style.css') {
            Invoke-WebRequest "http://localhost:3000/$asset" -UseBasicParsing | Out-Null
          }

          $login = Invoke-WebRequest "http://localhost:3000/guess-market/login" -Method Post -Body @{ name = 'WebOnWindows' } -SessionVariable web -UseBasicParsing
          $me = Invoke-RestMethod "http://localhost:3000/guess-market/me" -WebSession $web
          if ($me.name -ne 'WebOnWindows') { throw "the session cookie did not survive the pass-through" }

          curl.exe -s -b "JSESSIONID=$($web.Cookies.GetCookies('http://localhost:3000/guess-market/')['JSESSIONID'].Value)" -F "file=@test-files/ex3/multiple.xml" http://localhost:3000/guess-market/upload
          $events = Invoke-RestMethod "http://localhost:3000/guess-market/events" -WebSession $web
          if ($events.Count -ne 3) { throw "expected the 3 uploaded events, got $($events.Count)" }
          Write-Host "Page, assets, login, session and API all work through run.bat on Windows."
